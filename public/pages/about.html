<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在进入次元日记</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://yzh1019.top/about-me/">
  <meta http-equiv="refresh" content="0;url=/about-me/">
  <script>
    (() => { const target = new URL("/about-me/",location.origin);
      for (const [key,value] of new URLSearchParams(location.search)) target.searchParams.append(key,value);
      target.hash = location.hash;
      location.replace(target.pathname + target.search + target.hash); })();
  </script>
</head>
<body><p>正在进入次元日记。<a href="/about-me/">点击继续</a></p></body>
