  <div id="site-shell-top"></div>

      <h1 class="hero-title">次元日记</h1>
      <div class="hero-typewriter-row">我是一个 <span id="typewriter"></span></div>

      <div class="hero-actions">
        <a href="pages/posts.html" class="btn btn-primary">✦ 探索文章</a>

      </div>
      <div class="hero-scroll"><span class="scroll-arrow">↓</span>向下滚动</div>
    </section>

    <div class="stats-bar reveal home-deferred">
      <div class="stat-item"><div class="stat-num">7</div><div class="stat-label">篇文章</div></div>

      <div class="stat-item"><div class="stat-num">∞</div><div class="stat-label">热爱</div></div>
    </div>

    <section class="home-deferred">
      <div class="glass-card reveal">
        <div class="about-strip">
          <div class="about-avatar"></div>
          <div class="about-info">
            <h2>你好，我是这个次元空间的主人 ✦</h2>

            <div class="about-tags">
              <span class="tag">ACG 爱好者</span>
              <span class="tag">编程爱好者</span>
              <span class="tag">AI 爱好者</span>
              <span class="tag">吃谷爱好者</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="home-deferred">
      <div class="section-header">
        <div class="section-header-row">
          <div>
            <div class="section-label">Latest Posts</div>
            <div class="divider"></div>

      </div>

    <section>
