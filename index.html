<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>次元日记 · 首页</title>
  <meta name="description" content="次元日记是一个记录动画、漫画、游戏、项目作品与日常生活的个人静态博客。" />
  <meta name="theme-color" content="#120b18" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="次元日记 · 首页" />
  <meta property="og:description" content="次元日记是一个记录动画、漫画、游戏、项目作品与日常生活的个人静态博客。" />
  <meta property="og:image" content="assets/avatar.png" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="次元日记 · 首页" />
  <meta name="twitter:description" content="次元日记是一个记录动画、漫画、游戏、项目作品与日常生活的个人静态博客。" />
  <meta name="twitter:image" content="assets/avatar.png" />
  <link rel="icon" type="image/png" href="assets/avatar.png" />
  <link rel="stylesheet" href="css/main.css" />
  <script src="js/site-shell.js"></script>
  <style>
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 1.5rem 3rem;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 0.32rem 1rem;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.6rem;
      animation: fadeDown 0.8s ease both;
    }
    .hero-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    .hero-title {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: clamp(2.8rem, 9vw, 6rem);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: 0.04em;
      background: linear-gradient(130deg, #fdf6f0 0%, #f9a8c9 35%, #c084fc 68%, #67e8f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.8rem;
      animation: fadeUp 0.9s 0.15s ease both;
    }
    .hero-typewriter-row {
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
      min-height: 1.7em;
      animation: fadeUp 0.9s 0.28s ease both;
    }
    #typewriter {
      color: var(--sakura);
      border-right: 2px solid var(--sakura);
      padding-right: 2px;
    }
    .hero-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      max-width: 420px;
      line-height: 1.85;
      margin: 0 auto 2.2rem;
      animation: fadeUp 0.9s 0.38s ease both;
    }
    .hero-actions {
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.9s 0.48s ease both;
    }
    .hero-scroll {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      animation: fadeUp 1s 0.8s ease both;
    }
    .scroll-arrow {
      font-size: 1.1rem;
      animation: bounce 1.8s ease infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(26px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 2.5rem;
      padding: 1.2rem 2rem;
      margin: -1rem 0 3rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      border-radius: var(--radius);
    }
    .stat-item { text-align: center; }
    .stat-num {
      font-family: 'Raleway', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--sakura);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.4rem;
    }
    .post-card {
      display: block;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      color: var(--text);
    }
    .post-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px var(--shadow);
    }
    .post-card-img {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, rgba(249,168,201,0.1), rgba(192,132,252,0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      position: relative;
      overflow: hidden;
    }
    .post-card-img .img-bg {
      position: absolute;
      inset: -10px;
      background-size: cover;
      background-position: center;
      filter: blur(18px) brightness(0.6) saturate(1.2);
      transform: scale(1.05);
    }
    .post-card-img img {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .post-card-body { padding: 1.1rem 1.3rem 0.8rem; }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-family: 'Raleway', sans-serif;
    }
    .post-cat {
      padding: 0.15rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.68rem;
      background: var(--glass);
    }
    .post-card-title {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1.08rem;
      line-height: 1.4;
      margin-bottom: 0.5rem;
    }
    .post-card-excerpt {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .post-card-footer {
      padding: 0.7rem 1.3rem;
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .post-read-more { color: var(--sakura); }

    .about-strip {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2.5rem;
      align-items: center;
      padding: 2.5rem 3rem;
    }
    .about-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sakura-deep), var(--accent));
      background-image: url('assets/avatar.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: linear-gradient(135deg, var(--sakura-deep), var(--accent));
      position: relative;
      flex-shrink: 0;
    }
    .about-avatar::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sakura-deep), var(--accent), var(--accent2));
      z-index: -1;
      opacity: 0.5;
      filter: blur(10px);
    }
    .about-info h2 {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1.5rem;
      margin-bottom: 0.4rem;
    }
    .about-info p {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.8;
      max-width: 480px;
      margin-bottom: 1rem;
    }
    .about-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .project-mini {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.8rem;
    }
    .bm-card {
      padding: 0.9rem 1rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: background var(--transition);
    }
    .bm-card:hover { background: var(--glass-mid); }
    .bm-cover {
      width: 64px;
      height: 64px;
      border-radius: 0.9rem;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, rgba(249,168,201,0.12), rgba(192,132,252,0.12));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .bm-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .bm-info { min-width: 0; }
    .bm-title {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bm-bar {
      height: 3px;
      background: var(--glass-border);
      border-radius: 2px;
      margin-top: 0.4rem;
      overflow: hidden;
    }
    .bm-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--sakura-deep), var(--accent));
    }
    .bm-ep {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    section { padding: 4.5rem 0; }
    .section-header { margin-bottom: 2rem; }
    .section-header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    #typewriter::after {
      content: '|';
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 680px) {
      .about-strip {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 2rem 1.5rem;
      }
      .about-avatar { margin: 0 auto; }
      .about-tags { justify-content: center; }
      .posts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
