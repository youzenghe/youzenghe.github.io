backend:
  name: github
  repo: youzenghe/youzenghe.github.io
  branch: main
  base_url: https://yzh-decap-auth.yzh1019.workers.dev
  auth_endpoint: /auth

site_url: https://yzh1019.top
display_url: https://yzh1019.top
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
locale: "zh_Hans"

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "content/posts"
    create: true
    slug: "{{id}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}} · {{cat}} · {{date}}"
    sortable_fields: ["id", "title", "date", "updatedAt", "cat", "series", "status", "featured", "pinned"]
    view_groups:
      - label: "分类"
        field: "cat"
      - label: "专题"
        field: "series"
      - label: "状态"
        field: "status"
    view_filters:
      - label: "已发布"
        field: "status"
        pattern: "published"
      - label: "草稿"
        field: "status"
        pattern: "draft"
      - label: "精选"
        field: "featured"
        pattern: "true"
      - label: "置顶"
        field: "pinned"
        pattern: "true"
    fields:
      - { label: "ID", name: "id", widget: "number" }
      - { label: "标题", name: "title", widget: "string" }
      - { label: "分类", name: "cat", widget: "string", default: "技术笔记" }
      - { label: "专题", name: "series", widget: "string", default: "技术复盘" }
      - { label: "分类颜色", name: "catColor", widget: "string", default: "#67e8f9" }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "更新日期", name: "updatedAt", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "发布状态", name: "status", widget: "select", options: [{ label: "已发布", value: "published" }, { label: "草稿", value: "draft" }], default: "published" }
      - { label: "精选文章", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "置顶文章", name: "pinned", widget: "boolean", default: false, required: false }
      - { label: "阅读时间", name: "readTime", widget: "number", default: 4 }
      - { label: "表情", name: "emoji", widget: "string", default: "📝" }
      - { label: "封面路径", name: "cover", widget: "string", hint: "先到“媒体”页上传图片/GIF，再填 /assets/uploads/文件名；也可以填外部图片 URL。封面建议只放一张。" }
      - label: "文章图片集"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "图片路径", name: "image", widget: "string", hint: "先到“媒体”页上传图片/GIF，再填 /assets/uploads/文件名；也可以填外部图片 URL。" }
          - { label: "替代文本", name: "alt", widget: "string", required: false }
          - { label: "图片说明", name: "caption", widget: "string", required: false }
          - { label: "作为正文封面候选", name: "isCover", widget: "boolean", default: false, required: false }
      - { label: "摘要", name: "excerpt", widget: "text" }
      - { label: "SEO 标题", name: "metaTitle", widget: "string", required: false }
      - { label: "SEO 描述", name: "metaDescription", widget: "text", required: false }
      - { label: "社交分享图路径", name: "ogImage", widget: "string", required: false, hint: "先到“媒体”页上传图片/GIF，再填 /assets/uploads/文件名；也可以填外部图片 URL。" }
      - { label: "Canonical URL", name: "canonical", widget: "string", required: false }
      - label: "标签"
        name: "tags"
        widget: "list"
        field: { label: "标签项", name: "tag", widget: "string" }
      - label: "手动推荐文章 ID"
        name: "relatedPosts"
        widget: "list"
        required: false
        field: { label: "文章 ID", name: "postId", widget: "number" }
      - label: "正文"
        name: "body"
        widget: "markdown"
        modes: ["rich_text", "raw"]
        default_mode: "rich_text"
        editor_components: ["image", "code-block"]
        hint: "不用手写图片路径：点击编辑器工具栏里的 +，选择 IMAGE 后上传或选择图片/GIF，前台文章页会正常显示。后台编辑区若短暂显示占位图，不影响发布效果。"
        default: |
          ## 背景
          这里写清楚为什么要做这件事，问题来自哪里。

          ## 过程
          记录关键选择、实现步骤和中间踩坑。

          ## 复盘
          写结果、取舍，以及下次可以改进的地方。

  - name: "projects"
    label: "项目 / 查看复盘"
    files:
      - name: "projects"
        label: "项目列表与复盘内容"
        file: "content/projects.json"
        fields:
          - label: "项目与复盘"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}} · {{fields.cat}}"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "描述", name: "desc", widget: "text" }
              - label: "查看复盘正文（项目详情页）"
                name: "detail"
                widget: "text"
                required: false
                hint: "这里就是前台点击“查看复盘”后打开的正文。支持 Markdown 写法，也可以写 ![说明](图片地址) 插入图片或 GIF。这里不用富文本编辑器，是为了避免 Decap 在嵌套项目列表里崩溃。"
                default: |
                  ## 项目背景
                  这里说明项目目标、使用场景和核心需求。

                  ## 技术实现
                  记录主要技术栈、模块分工和关键实现。

                  ## 复盘结论
                  写清楚最终结果、遇到的问题和后续优化方向。
              - { label: "分类", name: "cat", widget: "string" }
              - { label: "项目状态", name: "status", widget: "select", options: ["规划中", "开发中", "已完成", "已上线", "维护中", "归档"], default: "已完成" }
              - { label: "我的职责", name: "role", widget: "text", required: false }
              - label: "技术栈"
                name: "tech"
                widget: "list"
                field: { label: "技术项", name: "techItem", widget: "string" }
              - { label: "日期", name: "date", widget: "string" }
              - { label: "奖项键", name: "award", widget: "select", options: ["gold", "silver", "bronze", "none"] }
              - { label: "奖项文本", name: "awardText", widget: "string" }
              - { label: "表情", name: "emoji", widget: "string" }
              - { label: "图片路径", name: "img", widget: "string", hint: "项目主图建议只放一张。可以先到“媒体”页上传图片/GIF，再填 /assets/uploads/文件名；旧项目也可以继续使用 ../assets/projects/xxx.webp。" }
              - label: "项目链接"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "名称", name: "label", widget: "string" }
                  - { label: "链接", name: "url", widget: "string" }
                  - { label: "类型", name: "type", widget: "select", options: ["演示", "源码", "文档", "报道", "其他"], default: "演示" }
              - label: "技术亮点"
                name: "highlights"
                widget: "list"
                required: false
                field: { label: "亮点", name: "highlight", widget: "string" }
              - label: "踩坑/难点"
                name: "challenges"
                widget: "list"
                required: false
                field: { label: "难点", name: "challenge", widget: "string" }
              - { label: "结果/复盘结论", name: "result", widget: "text", required: false }
              - label: "项目图片集"
                name: "images"
                widget: "list"
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: "图片路径", name: "image", widget: "string", hint: "可以先到“媒体”页上传图片/GIF，再填 /assets/uploads/文件名。" }
                  - { label: "替代文本", name: "alt", widget: "string", required: false }
                  - { label: "图片说明", name: "caption", widget: "string", required: false }

  - name: "changelog"
    label: "更新日志（页面）"
    files:
      - name: "changelog"
        label: "更新日志页面内容"
        file: "content/changelog.json"
        fields:
          - label: "更新记录"
            name: "changelog"
            widget: "list"
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "类型", name: "type", widget: "select", options: ["功能", "性能", "体验", "修复", "内容"] }
              - label: "条目"
                name: "items"
                widget: "list"
                field: { label: "条目内容", name: "item", widget: "string" }

  - name: "games"
    label: "游戏"
    files:
      - name: "games"
        label: "游戏列表"
        file: "content/games.json"
        fields:
          - label: "游戏"
            name: "games"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "分类", name: "category", widget: "string" }
              - { label: "描述", name: "description", widget: "text" }
              - { label: "预览表情", name: "previewEmoji", widget: "string" }
              - { label: "图片路径", name: "image", widget: "string", hint: "可以先到“媒体”页上传图片/GIF，再填 /assets/uploads/文件名。" }
              - { label: "类型", name: "type", widget: "string" }
              - { label: "平台", name: "platform", widget: "string" }
              - { label: "发布日期", name: "releaseDate", widget: "string" }
              - { label: "状态", name: "status", widget: "string" }
              - { label: "下载链接", name: "downloadLink", widget: "string" }

  - name: "friend-links"
    label: "友链"
    files:
      - name: "friend-links"
        label: "友链列表"
        file: "content/friend-links.json"
        fields:
          - label: "友链"
            name: "friendLinks"
            widget: "list"
            fields:
              - { label: "名称", name: "name", widget: "string" }
              - { label: "链接", name: "url", widget: "string" }
              - { label: "展示链接", name: "displayUrl", widget: "string" }
              - { label: "徽章", name: "badge", widget: "string" }
