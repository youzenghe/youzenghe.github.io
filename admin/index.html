<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 超级小识</title>
  <style>
    .cms-editor-image-fallback {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 96px;
      padding: 0.75rem 1rem;
      border: 1px dashed #9ca3af;
      border-radius: 6px;
      background: #f8fafc;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }
    .paste-upload-toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 99999;
      max-width: 360px;
      padding: 12px 16px;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      box-shadow: 0 16px 42px rgba(15,23,42,0.28);
      font-size: 14px;
      line-height: 1.55;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .paste-upload-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <script>
    document.addEventListener('error', (event) => {
      const img = event.target;
      if (!(img instanceof HTMLImageElement)) return;
      const src = img.getAttribute('src') || '';
      if (!src.includes('/assets/')) return;

      img.style.display = 'none';
      if (img.nextElementSibling?.classList?.contains('cms-editor-image-fallback')) return;

      const fallback = document.createElement('span');
      fallback.className = 'cms-editor-image-fallback';
      fallback.textContent = '图片已插入，发布后前台会正常显示';
      img.insertAdjacentElement('afterend', fallback);
    }, true);
  </script>
  <script src="https://unpkg.com/decap-cms@^3.4.0/dist/decap-cms.js"></script>
  <script>
    const PASTE_UPLOAD_REPO = 'youzenghe/youzenghe.github.io';
    const PASTE_UPLOAD_BRANCH = 'main';
    const PASTE_UPLOAD_DIR = 'assets/uploads';

    function showPasteUploadToast(message, timeout = 2600) {
      let toast = document.querySelector('.paste-upload-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'paste-upload-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.classList.add('is-visible');
      window.clearTimeout(toast.hideTimer);
      toast.hideTimer = window.setTimeout(() => {
        toast.classList.remove('is-visible');
      }, timeout);
    }

    function readJsonSafe(value) {
      try {
        return JSON.parse(value);
      } catch (error) {
        return null;
      }
    }

    function findTokenInValue(value, depth = 0) {
      if (!value || depth > 6) return '';
      if (typeof value === 'string') {
        if (/^(gho_|ghp_|github_pat_|[a-f0-9]{40})/i.test(value) || value.length > 80) {
          return value;
        }
        const parsed = readJsonSafe(value);
        return parsed ? findTokenInValue(parsed, depth + 1) : '';
      }
      if (Array.isArray(value)) {
        for (const item of value) {
          const token = findTokenInValue(item, depth + 1);
          if (token) return token;
        }
        return '';
      }
      if (typeof value === 'object') {
        for (const key of ['token', 'access_token', 'accessToken', 'oauth_token']) {
          if (typeof value[key] === 'string') {
            return value[key];
          }
        }
        for (const item of Object.values(value)) {
          const token = findTokenInValue(item, depth + 1);
          if (token) return token;
        }
      }
      return '';
    }

    function getDecapGithubToken() {
      const stores = [window.localStorage, window.sessionStorage].filter(Boolean);
      const preferredKeys = [];
      const otherKeys = [];

      stores.forEach((store, storeIndex) => {
        for (let index = 0; index < store.length; index += 1) {
          const key = store.key(index);
          const item = { storeIndex, key };
          if (/cms|decap|netlify|github|token/i.test(key)) {
            preferredKeys.push(item);
          } else {
            otherKeys.push(item);
          }
        }
      });

      for (const { storeIndex, key } of [...preferredKeys, ...otherKeys]) {
        const token = findTokenInValue(stores[storeIndex].getItem(key));
        if (token) return token;
      }
      return '';
    }

    function pastedImageFile(event) {
      const items = Array.from(event.clipboardData?.items || []);
      const imageItem = items.find((item) => item.kind === 'file' && item.type.startsWith('image/'));
      return imageItem?.getAsFile() || null;
    }

    function extensionForImage(file) {
      const byType = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/gif': 'gif',
        'image/webp': 'webp',
      };
      if (byType[file.type]) return byType[file.type];
      const ext = file.name?.split('.').pop()?.toLowerCase();
      return ext && /^[a-z0-9]+$/.test(ext) ? ext : 'png';
    }

    function uploadFileName(file) {
      const now = new Date();
      const stamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0'),
        String(now.getHours()).padStart(2, '0'),
        String(now.getMinutes()).padStart(2, '0'),
        String(now.getSeconds()).padStart(2, '0'),
      ].join('');
      const random = Math.random().toString(36).slice(2, 8);
      return `paste-${stamp}-${random}.${extensionForImage(file)}`;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const chunkSize = 0x8000;
      for (let index = 0; index < bytes.length; index += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
      }
      return window.btoa(binary);
    }

    async function uploadPastedImage(file) {
      const token = getDecapGithubToken();
      if (!token) {
        throw new Error('没有找到后台登录 token，请重新登录后台后再粘贴图片。');
      }

      const fileName = uploadFileName(file);
      const uploadPath = `${PASTE_UPLOAD_DIR}/${fileName}`;
      const content = arrayBufferToBase64(await file.arrayBuffer());
      const response = await fetch(`https://api.github.com/repos/${PASTE_UPLOAD_REPO}/contents/${encodeURIComponent(uploadPath).replace(/%2F/g, '/')}`, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          message: `Upload pasted image ${fileName}`,
          content,
          branch: PASTE_UPLOAD_BRANCH,
        }),
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(`图片上传失败：${response.status} ${text}`);
      }

      return `/${uploadPath}`;
    }

    function activeEditorElement(event) {
      const target = event.target;
      if (target instanceof HTMLTextAreaElement || target instanceof HTMLInputElement) return target;
      if (target?.isContentEditable) return target;
      return document.activeElement;
    }

    function insertMarkdownAtCursor(target, markdown) {
      if (target instanceof HTMLTextAreaElement || target instanceof HTMLInputElement) {
        const start = target.selectionStart ?? target.value.length;
        const end = target.selectionEnd ?? target.value.length;
        const before = target.value.slice(0, start);
        const after = target.value.slice(end);
        const prefix = before && !before.endsWith('\n') ? '\n\n' : '';
        const suffix = after && !after.startsWith('\n') ? '\n\n' : '';
        const insertion = `${prefix}${markdown}${suffix}`;
        target.value = `${before}${insertion}${after}`;
        const cursor = before.length + insertion.length;
        target.setSelectionRange(cursor, cursor);
        target.dispatchEvent(new Event('input', { bubbles: true }));
        target.dispatchEvent(new Event('change', { bubbles: true }));
        return true;
      }

      if (target?.isContentEditable) {
        const selection = window.getSelection();
        const prefix = '\n\n';
        const suffix = '\n\n';
        selection?.deleteFromDocument();
        document.execCommand('insertText', false, `${prefix}${markdown}${suffix}`);
        return true;
      }

      return false;
    }

    document.addEventListener('paste', async (event) => {
      const file = pastedImageFile(event);
      if (!file) return;

      const target = activeEditorElement(event);
      event.preventDefault();
      showPasteUploadToast('正在上传粘贴的图片...');

      try {
        const url = await uploadPastedImage(file);
        const markdown = `![粘贴图片](${url})`;
        if (!insertMarkdownAtCursor(target, markdown)) {
          throw new Error('没有找到可以插入图片的正文编辑框。');
        }
        showPasteUploadToast('图片已上传并插入正文');
      } catch (error) {
        showPasteUploadToast(error.message || '图片粘贴失败', 5200);
      }
    }, true);
  </script>
</body>
</html>
