<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 超级小识</title>
  <style>
    .cms-editor-image-fallback {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 96px;
      padding: 0.75rem 1rem;
      border: 1px dashed #9ca3af;
      border-radius: 6px;
      background: #f8fafc;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }
    .paste-upload-toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 99999;
      max-width: 360px;
      padding: 12px 16px;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      box-shadow: 0 16px 42px rgba(15,23,42,0.28);
      font-size: 14px;
      line-height: 1.55;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .paste-upload-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <script>
    document.addEventListener('error', (event) => {
      const img = event.target;
      if (!(img instanceof HTMLImageElement)) return;
      const src = img.getAttribute('src') || '';
      if (!src.includes('/assets/')) return;

      img.style.display = 'none';
      if (img.nextElementSibling?.classList?.contains('cms-editor-image-fallback')) return;

      const fallback = document.createElement('span');
      fallback.className = 'cms-editor-image-fallback';
      fallback.textContent = '图片已插入，发布后前台会正常显示';
      img.insertAdjacentElement('afterend', fallback);
    }, true);
  </script>
  <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>
  <script>
    const PASTE_UPLOAD_REPO = 'youzenghe/youzenghe.github.io';
    const PASTE_UPLOAD_BRANCH = 'main';
    const PASTE_UPLOAD_DIR = 'assets/uploads';
    const IMAGE_COMPRESS_MAX_DIMENSION = 1800;
    const IMAGE_COMPRESS_QUALITY = 0.82;
    const IMAGE_COMPRESS_MIN_RATIO = 0.92;
    const COMPRESSIBLE_IMAGE_TYPES = new Set(['image/jpeg', 'image/png', 'image/webp']);
    const SKIP_UPLOAD_COMPRESSION_PATHS = new Set();

    function showPasteUploadToast(message, timeout = 2600) {
      let toast = document.querySelector('.paste-upload-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'paste-upload-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.classList.add('is-visible');
      window.clearTimeout(toast.hideTimer);
      toast.hideTimer = window.setTimeout(() => {
        toast.classList.remove('is-visible');
      }, timeout);
    }

    function readJsonSafe(value) {
      try {
        return JSON.parse(value);
      } catch (error) {
        return null;
      }
    }

    function isLikelyGithubToken(value) {
      if (typeof value !== 'string') return false;
      const token = value.trim();
      if (!/^[\x21-\x7e]+$/.test(token)) return false;
      return /^(gh[opusr]_|github_pat_)/i.test(token) || /^[a-f0-9]{40}$/i.test(token);
    }

    function findTokenInValue(value, depth = 0) {
      if (!value || depth > 6) return '';
      if (typeof value === 'string') {
        const token = value.trim();
        if (isLikelyGithubToken(token)) {
          return token;
        }
        const parsed = readJsonSafe(value);
        return parsed ? findTokenInValue(parsed, depth + 1) : '';
      }
      if (Array.isArray(value)) {
        for (const item of value) {
          const token = findTokenInValue(item, depth + 1);
          if (token) return token;
        }
        return '';
      }
      if (typeof value === 'object') {
        for (const key of ['token', 'access_token', 'accessToken', 'oauth_token']) {
          const token = typeof value[key] === 'string' ? value[key].trim() : '';
          if (isLikelyGithubToken(token)) {
            return token;
          }
        }
        for (const item of Object.values(value)) {
          const token = findTokenInValue(item, depth + 1);
          if (token) return token;
        }
      }
      return '';
    }

    function getDecapGithubToken() {
      const stores = [window.localStorage, window.sessionStorage].filter(Boolean);
      const preferredKeys = [];
      const otherKeys = [];

      stores.forEach((store, storeIndex) => {
        for (let index = 0; index < store.length; index += 1) {
          const key = store.key(index);
          const item = { storeIndex, key };
          if (/cms|decap|netlify|github|token/i.test(key)) {
            preferredKeys.push(item);
          } else {
            otherKeys.push(item);
          }
        }
      });

      for (const { storeIndex, key } of [...preferredKeys, ...otherKeys]) {
        const token = findTokenInValue(stores[storeIndex].getItem(key));
        if (token) return token;
      }
      return '';
    }

    function pastedImageFile(event) {
      const items = Array.from(event.clipboardData?.items || []);
      const imageItem = items.find((item) => item.kind === 'file' && item.type.startsWith('image/'));
      return imageItem?.getAsFile() || null;
    }

    function extensionForImage(file) {
      const byType = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/gif': 'gif',
        'image/webp': 'webp',
      };
      if (byType[file.type]) return byType[file.type];
      const ext = file.name?.split('.').pop()?.toLowerCase();
      return ext && /^[a-z0-9]+$/.test(ext) ? ext : 'png';
    }

    function extensionForMime(type) {
      return ({
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/gif': 'gif',
        'image/webp': 'webp',
      })[type] || 'png';
    }

    function uploadFileName(file, extension = extensionForImage(file)) {
      const now = new Date();
      const stamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0'),
        String(now.getHours()).padStart(2, '0'),
        String(now.getMinutes()).padStart(2, '0'),
        String(now.getSeconds()).padStart(2, '0'),
      ].join('');
      const random = Math.random().toString(36).slice(2, 8);
      return `paste-${stamp}-${random}.${extension}`;
    }

    function formatFileSize(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return '0 KB';
      if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      return `${Math.max(1, Math.round(bytes / 1024))} KB`;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const chunkSize = 0x8000;
      for (let index = 0; index < bytes.length; index += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
      }
      return window.btoa(binary);
    }

    function base64ToUint8Array(base64) {
      const binary = window.atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    function mimeFromFileName(fileName) {
      const ext = fileName.split('.').pop()?.toLowerCase();
      return ({
        jpg: 'image/jpeg',
        jpeg: 'image/jpeg',
        png: 'image/png',
        gif: 'image/gif',
        webp: 'image/webp',
      })[ext] || '';
    }

    function detectImageMime(bytes, fileName = '') {
      if (bytes[0] === 0xff && bytes[1] === 0xd8) return 'image/jpeg';
      if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) return 'image/png';
      if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46) return 'image/gif';
      if (bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[8] === 0x57 && bytes[9] === 0x45) return 'image/webp';
      return mimeFromFileName(fileName);
    }

    function loadImageFromBlob(blob) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('图片读取失败，已按原图上传。'));
        };
        img.src = url;
      });
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve) => {
        canvas.toBlob(resolve, type, quality);
      });
    }

    async function compressImageBlob(blob, fileName = 'image', options = {}) {
      const sourceType = blob.type || mimeFromFileName(fileName);
      if (!COMPRESSIBLE_IMAGE_TYPES.has(sourceType)) {
        return {
          blob,
          extension: extensionForMime(sourceType) || extensionForImage({ type: sourceType, name: fileName }),
          changed: false,
          skipped: sourceType === 'image/gif' ? 'gif' : 'unsupported',
        };
      }

      const image = await loadImageFromBlob(blob);
      const width = image.naturalWidth || image.width;
      const height = image.naturalHeight || image.height;
      if (!width || !height) {
        return { blob, extension: extensionForMime(sourceType), changed: false, skipped: 'invalid' };
      }

      const scale = Math.min(1, IMAGE_COMPRESS_MAX_DIMENSION / Math.max(width, height));
      const targetWidth = Math.max(1, Math.round(width * scale));
      const targetHeight = Math.max(1, Math.round(height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0, targetWidth, targetHeight);

      const targetType = options.preserveType ? sourceType : 'image/webp';
      const compressed = await canvasToBlob(
        canvas,
        targetType,
        targetType === 'image/png' ? undefined : IMAGE_COMPRESS_QUALITY,
      );
      if (!compressed || compressed.size >= blob.size * IMAGE_COMPRESS_MIN_RATIO) {
        return { blob, extension: extensionForMime(sourceType), changed: false, skipped: 'not-smaller' };
      }

      return {
        blob: compressed,
        extension: extensionForMime(targetType),
        changed: true,
        originalSize: blob.size,
        compressedSize: compressed.size,
      };
    }

    async function prepareImageForUpload(file) {
      const optimized = await compressImageBlob(file, file.name || 'pasted-image');
      if (optimized.changed) {
        showPasteUploadToast(`图片已压缩：${formatFileSize(optimized.originalSize)} → ${formatFileSize(optimized.compressedSize)}`);
      } else if (optimized.skipped === 'gif') {
        showPasteUploadToast('GIF 已跳过压缩，避免影响动画');
      }
      return {
        blob: optimized.blob,
        extension: optimized.extension || extensionForImage(file),
        optimized,
      };
    }

    function contentsUploadPathFromUrl(url) {
      try {
        const parsed = new URL(url, location.href);
        if (parsed.origin !== 'https://api.github.com') return '';
        const prefix = `/repos/${PASTE_UPLOAD_REPO}/contents/`;
        const decodedPath = decodeURIComponent(parsed.pathname);
        if (!decodedPath.startsWith(prefix)) return '';
        const uploadPath = decodedPath.slice(prefix.length);
        return uploadPath.startsWith(`${PASTE_UPLOAD_DIR}/`) ? uploadPath : '';
      } catch (error) {
        return '';
      }
    }

    function replaceContentsUploadFileName(url, nextFileName) {
      const parsed = new URL(url, location.href);
      const segments = parsed.pathname.split('/');
      segments[segments.length - 1] = encodeURIComponent(nextFileName);
      parsed.pathname = segments.join('/');
      return parsed.href;
    }

    async function maybeCompressGithubUpload(input, init = {}) {
      if (typeof input !== 'string' && !(input instanceof URL)) return null;
      const url = String(input);
      const method = String(init.method || 'GET').toUpperCase();
      if (method !== 'PUT' || typeof init.body !== 'string') return null;

      const uploadPath = contentsUploadPathFromUrl(url);
      if (!uploadPath || SKIP_UPLOAD_COMPRESSION_PATHS.has(uploadPath)) return null;

      const payload = readJsonSafe(init.body);
      if (!payload?.content) return null;

      const fileName = decodeURIComponent(uploadPath.split('/').pop() || 'upload');
      const bytes = base64ToUint8Array(payload.content.replace(/\s/g, ''));
      const type = detectImageMime(bytes, fileName);
      if (type === 'image/gif' || !COMPRESSIBLE_IMAGE_TYPES.has(type)) return null;

      const original = new Blob([bytes], { type });
      const optimized = await compressImageBlob(original, fileName, { preserveType: true });
      if (!optimized.changed) return null;

      const nextFileName = fileName;
      const nextUploadPath = uploadPath;
      const nextUrl = replaceContentsUploadFileName(url, nextFileName);
      const nextContent = arrayBufferToBase64(await optimized.blob.arrayBuffer());
      const nextPayload = {
        ...payload,
        message: payload.message || `Upload compressed image ${nextFileName}`,
        content: nextContent,
      };

      showPasteUploadToast(`图片已压缩：${formatFileSize(optimized.originalSize)} → ${formatFileSize(optimized.compressedSize)}`);
      SKIP_UPLOAD_COMPRESSION_PATHS.add(nextUploadPath);
      return {
        input: nextUrl,
        init: {
          ...init,
          body: JSON.stringify(nextPayload),
        },
      };
    }

    const originalFetch = window.fetch.bind(window);
    window.fetch = async (input, init) => {
      try {
        const compressed = await maybeCompressGithubUpload(input, init || {});
        if (compressed) {
          return originalFetch(compressed.input, compressed.init);
        }
      } catch (error) {
        showPasteUploadToast(error.message || '图片压缩失败，按原图上传', 4200);
      }
      return originalFetch(input, init);
    };

    async function uploadPastedImage(file) {
      const token = getDecapGithubToken();
      if (!token) {
        throw new Error('没有找到后台登录 token，请重新登录后台后再粘贴图片。');
      }

      const prepared = await prepareImageForUpload(file);
      const fileName = uploadFileName(file, prepared.extension);
      const uploadPath = `${PASTE_UPLOAD_DIR}/${fileName}`;
      SKIP_UPLOAD_COMPRESSION_PATHS.add(uploadPath);
      const content = arrayBufferToBase64(await prepared.blob.arrayBuffer());
      const response = await fetch(`https://api.github.com/repos/${PASTE_UPLOAD_REPO}/contents/${encodeURIComponent(uploadPath).replace(/%2F/g, '/')}`, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          message: `Upload pasted image ${fileName}`,
          content,
          branch: PASTE_UPLOAD_BRANCH,
        }),
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(`图片上传失败：${response.status} ${text}`);
      }

      return `/${uploadPath}`;
    }

    function activeEditorElement(event) {
      const target = event.target;
      if (target instanceof HTMLTextAreaElement || target instanceof HTMLInputElement) return target;
      if (target?.isContentEditable) return target;
      return document.activeElement;
    }

    function insertMarkdownAtCursor(target, markdown) {
      if (target instanceof HTMLTextAreaElement || target instanceof HTMLInputElement) {
        const start = target.selectionStart ?? target.value.length;
        const end = target.selectionEnd ?? target.value.length;
        const before = target.value.slice(0, start);
        const after = target.value.slice(end);
        const prefix = before && !before.endsWith('\n') ? '\n\n' : '';
        const suffix = after && !after.startsWith('\n') ? '\n\n' : '';
        const insertion = `${prefix}${markdown}${suffix}`;
        target.value = `${before}${insertion}${after}`;
        const cursor = before.length + insertion.length;
        target.setSelectionRange(cursor, cursor);
        target.dispatchEvent(new Event('input', { bubbles: true }));
        target.dispatchEvent(new Event('change', { bubbles: true }));
        return true;
      }

      if (target?.isContentEditable) {
        const selection = window.getSelection();
        const prefix = '\n\n';
        const suffix = '\n\n';
        selection?.deleteFromDocument();
        document.execCommand('insertText', false, `${prefix}${markdown}${suffix}`);
        return true;
      }

      return false;
    }

    document.addEventListener('paste', async (event) => {
      const file = pastedImageFile(event);
      if (!file) return;

      const target = activeEditorElement(event);
      event.preventDefault();
      showPasteUploadToast(file.type === 'image/gif' ? '正在上传 GIF...' : '正在压缩并上传图片...');

      try {
        const url = await uploadPastedImage(file);
        const markdown = `![粘贴图片](${url})`;
        if (!insertMarkdownAtCursor(target, markdown)) {
          throw new Error('没有找到可以插入图片的正文编辑框。');
        }
        showPasteUploadToast('图片已上传并插入正文');
      } catch (error) {
        showPasteUploadToast(error.message || '图片粘贴失败', 5200);
      }
    }, true);
  </script>
</body>
</html>
