name: Build and Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install image tools
        run: python -m pip install Pillow

      - name: Optimize uploaded images
        run: python scripts/optimize_upload_images.py

      - name: Generate thumbnails
        run: python scripts/generate_thumbnails.py

      - name: Validate content
        run: python scripts/validate_content.py

      - name: Build content bundle
        run: python scripts/build_content.py

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Subset self-hosted fonts
        run: |
          python -m pip install fonttools brotli
          python scripts/build_fonts.py

      - name: Install frontend build tools
        run: npm ci

      - name: Build compressed site
        run: npm run build:dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
