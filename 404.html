<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面未找到 · 次元日记</title>
  <meta name="description" content="你访问的页面不存在，返回次元日记首页继续浏览。" />
  <meta name="theme-color" content="#120b18" />
  <link rel="icon" type="image/png" href="assets/avatar.png" />
  <link rel="stylesheet" href="css/main.css" />
  <script src="js/site-shell.js"></script>
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .not-found-card {
      max-width: 560px;
      padding: 2.5rem 2rem;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px var(--shadow);
    }
    .not-found-code {
      font-family: 'Raleway', sans-serif;
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 900;
      color: var(--sakura);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .not-found-title {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }
    .not-found-desc {
      color: var(--text-muted);
      line-height: 1.9;
      margin-bottom: 1.5rem;
    }
    .not-found-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body data-root-prefix="" data-loader-text="页面加载中..." data-live2d="false">
  <div id="site-shell-top"></div>

  <div class="site-wrapper not-found">
    <div class="not-found-card reveal visible">
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">你访问的页面不见了</h1>
      <p class="not-found-desc">这个链接可能已经失效、地址输入有误，或者页面已经被调整。你可以返回首页，或者继续浏览文章与项目。</p>
      <div class="not-found-actions">
        <a href="index.html" class="btn btn-primary">返回首页</a>
        <a href="pages/posts.html" class="btn btn-ghost">浏览文章</a>
        <a href="pages/projects.html" class="btn btn-ghost">查看项目</a>
      </div>
    </div>
  </div>

  <div id="site-shell-bottom"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
