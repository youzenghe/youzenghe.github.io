  <style>
    :root {
      --resource-bg: #f7f4f7;
      --resource-card: rgba(255, 255, 255, 0.78);
      --resource-line: rgba(58, 48, 58, 0.1);
      --resource-text: #2e2930;
      --resource-muted: rgba(46, 41, 48, 0.58);
      --resource-primary: #e85d88;
      --resource-primary-soft: rgba(232, 93, 136, 0.12);
      --resource-blue: #5a9fd6;
      --resource-green: #4fae88;
      --resource-amber: #d89a32;
    }
    body {
      background:
        radial-gradient(circle at 8% 10%, rgba(232, 93, 136, 0.13), transparent 28rem),
        radial-gradient(circle at 92% 20%, rgba(90, 159, 214, 0.14), transparent 30rem),
        linear-gradient(180deg, #fff 0%, var(--resource-bg) 38%, #f1eef3 100%);
    }
    .resource-shell {
      color: var(--resource-text);
      padding-top: 2rem;
    }
    .resource-hero {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--resource-line);
      border-radius: 1.1rem;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.58)),
        repeating-linear-gradient(0deg, transparent 0 34px, rgba(232,93,136,0.08) 34px 35px);
      box-shadow: 0 24px 70px rgba(55, 45, 60, 0.1);
      padding: clamp(1.3rem, 4vw, 2.4rem);
    }
    .resource-hero::after {
      content: "";
      position: absolute;
      right: -5rem;
      top: -5rem;
      width: 17rem;
      height: 17rem;
      border-radius: 50%;
      border: 2rem solid rgba(232,93,136,0.08);
      pointer-events: none;
    }
    .resource-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--resource-primary);
      font-family: var(--font-ui);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .resource-hero h1 {
      width: min(48rem, 100%);
      margin: 0.8rem 0 0.7rem;
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .resource-hero p {
      width: min(48rem, 100%);
      margin: 0;
      color: var(--resource-muted);
      line-height: 1.85;
    }
    .resource-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.8rem;
      margin-top: 1.4rem;
    }
    .resource-stat {
      padding: 0.9rem 1rem;
      border: 1px solid var(--resource-line);
      border-radius: 0.85rem;
      background: rgba(255,255,255,0.68);
    }
    .resource-stat strong {
      display: block;
      color: var(--resource-primary);
      font-size: 1.3rem;
      line-height: 1.1;
    }
    .resource-stat span {
      display: block;
      margin-top: 0.28rem;
      color: var(--resource-muted);
      font-size: 0.78rem;
    }
    .resource-toolbar {
      position: sticky;
      top: 5rem;
      z-index: 5;
      margin: 1.2rem 0 1.5rem;
      padding: 1rem;
      border: 1px solid var(--resource-line);
      border-radius: 1rem;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 36px rgba(55, 45, 60, 0.08);
    }
    .resource-search {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      padding: 0.78rem 1rem;
      border: 1px solid var(--resource-line);
      border-radius: 0.85rem;
      background: rgba(255,255,255,0.75);
    }
    .resource-search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--resource-text);
      font: inherit;
    }
    .resource-search input::placeholder {
      color: rgba(46, 41, 48, 0.38);
    }
    .resource-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 0.85rem;
    }
    .resource-tab {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 2.35rem;
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--resource-line);
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      color: var(--resource-muted);
      font-size: 0.84rem;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .resource-tab:hover {
      transform: translateY(-1px);
      border-color: rgba(232,93,136,0.35);
      color: var(--resource-primary);
    }
    .resource-tab.is-active {
      border-color: var(--resource-primary);
      background: var(--resource-primary);
      color: #fff;
    }
    .resource-count {
      opacity: 0.72;
      font-size: 0.76rem;
    }
    .resource-section {
      margin-top: 2rem;
    }
    .resource-section[hidden] {
      display: none;
    }
    .resource-section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }
    .resource-section-title {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .resource-section-icon {
      width: 2.35rem;
      height: 2.35rem;
      display: grid;
      place-items: center;
      border-radius: 0.75rem;
      background: var(--resource-primary-soft);
      color: var(--resource-primary);
      font-size: 1.25rem;
    }
    .resource-section h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.5rem;
      letter-spacing: 0;
    }
    .resource-section-desc {
      margin: 0.18rem 0 0;
      color: var(--resource-muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.9rem;
    }
    .resource-card {
      position: relative;
      min-height: 9.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding: 1rem;
      border: 1px solid var(--resource-line);
      border-radius: 0.95rem;
      background: var(--resource-card);
      color: var(--resource-text);
      box-shadow: 0 10px 28px rgba(55, 45, 60, 0.06);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
    }
    .resource-card:hover {
      transform: translateY(-3px);
      border-color: rgba(232,93,136,0.36);
      background: rgba(255,255,255,0.95);
      box-shadow: 0 18px 44px rgba(55, 45, 60, 0.12);
    }
    .resource-card.is-hidden {
      display: none;
    }
    .resource-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }
    .resource-card strong {
      font-size: 1rem;
      line-height: 1.35;
    }
    .resource-card p {
      margin: 0;
      color: var(--resource-muted);
      font-size: 0.83rem;
      line-height: 1.65;
    }
    .resource-card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-top: auto;
      color: var(--resource-primary);
      font-family: var(--font-ui);
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .resource-kind {
      color: var(--resource-muted);
      font-weight: 700;
      text-transform: none;
    }
    .resource-empty {
      display: none;
      padding: 2rem;
      border: 1px dashed rgba(232,93,136,0.32);
      border-radius: 1rem;
      background: rgba(255,255,255,0.62);
      color: var(--resource-muted);
      text-align: center;
    }
    .resource-empty.is-visible {
      display: block;
    }
    @media (max-width: 1080px) {
      .resource-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .resource-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1180px) {
      body.resource-page .resource-toolbar {
        position: fixed;
        left: 1.15rem;
        top: 5.25rem;
        z-index: 120;
        width: clamp(13.5rem, 15vw, 16rem);
        max-height: min(34rem, calc(100vh - 24rem));
        padding: 0.9rem;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      body.resource-page .resource-search {
        padding: 0.68rem 0.78rem;
      }
      body.resource-page .resource-tabs {
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 0.45rem;
      }
      body.resource-page .resource-tab {
        width: 100%;
        justify-content: space-between;
        min-height: 2.2rem;
        padding: 0.48rem 0.72rem;
        border-radius: 0.8rem;
      }
      body.resource-page .resource-shell.site-wrapper {
        max-width: 1120px;
        margin-left: max(18rem, calc((100vw - 1120px) / 2 + 16rem));
        margin-right: max(2rem, calc((100vw - 1120px) / 2));
      }
    }
    @media (max-width: 680px) {
      .resource-toolbar { position: static; padding: 0.8rem; }
      .resource-grid { grid-template-columns: 1fr; }
      .resource-section-head { align-items: flex-start; flex-direction: column; }
      .resource-stats { grid-template-columns: 1fr 1fr; }
      .resource-card { min-height: 8.4rem; }
    }
  </style>
</head>

    const sectionsEl = document.getElementById('resource-sections');
    const tabsEl = document.getElementById('resource-tabs');
    const searchEl = document.getElementById('resource-search');
    const emptyEl = document.getElementById('resource-empty');
    const totalEl = document.getElementById('resource-total');
    const categoryTotalEl = document.getElementById('resource-category-total');
    let activeGroup = 'all';

    const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[ch]);

    function render() {
      const total = RESOURCE_GROUPS.reduce((sum, group) => sum + group.items.length, 0);
      totalEl.textContent = total;
      categoryTotalEl.textContent = RESOURCE_GROUPS.length;
      tabsEl.innerHTML = [
        `<button class="resource-tab is-active" type="button" data-group="all">全部 <span class="resource-count">${total}</span></button>`,
        ...RESOURCE_GROUPS.map((group) => (
          `<button class="resource-tab" type="button" data-group="${group.id}">${esc(group.title)} <span class="resource-count">${group.items.length}</span></button>`
        ))
      ].join('');
      sectionsEl.innerHTML = RESOURCE_GROUPS.map((group) => `
        <section class="resource-section" data-section="${group.id}">
          <header class="resource-section-head">
            <div class="resource-section-title">
              <span class="resource-section-icon" aria-hidden="true">${group.icon}</span>
              <div>
                <h2>${esc(group.title)}</h2>
                <p class="resource-section-desc">${esc(group.desc)}</p>
              </div>
            </div>
            <span class="resource-count">${group.items.length} items</span>
          </header>
          <div class="resource-grid">
            ${group.items.map((item) => resourceCard(group, item)).join('')}
          </div>
        </section>
      `).join('');
    }

    function resourceCard(group, item) {
      const [title, href, desc, kind] = item;
      const external = /^https?:\/\//i.test(href);
      const haystack = `${group.title} ${title} ${desc} ${kind}`.toLowerCase();
      return `
        <a class="resource-card" href="${esc(href)}" ${external ? 'target="_blank" rel="noreferrer noopener"' : ''} data-group="${group.id}" data-search="${esc(haystack)}">
          <div class="resource-card-top">
            <strong>${esc(title)}</strong>
            <span aria-hidden="true">↗</span>
          </div>
          <p>${esc(desc)}</p>
          <div class="resource-card-foot">
            <span>${external ? 'OPEN RESOURCE' : 'OPEN PAGE'}</span>
            <span class="resource-kind">${esc(kind)}</span>
          </div>
        </a>
      `;
    }

    function applyFilter() {
      const query = searchEl.value.trim().toLowerCase();
      let visible = 0;
      document.querySelectorAll('.resource-tab').forEach((tab) => {
        tab.classList.toggle('is-active', tab.dataset.group === activeGroup);
      });
      document.querySelectorAll('.resource-section').forEach((section) => {
        let sectionVisible = 0;
        const inActiveGroup = activeGroup === 'all' || section.dataset.section === activeGroup;
        section.querySelectorAll('.resource-card').forEach((card) => {
          const matchGroup = activeGroup === 'all' || card.dataset.group === activeGroup;
          const matchText = !query || card.dataset.search.includes(query);
          const show = matchGroup && matchText;
          card.classList.toggle('is-hidden', !show);
          if (show) {
            sectionVisible += 1;
            visible += 1;
          }
        });
        section.hidden = !inActiveGroup || sectionVisible === 0;
      });
      emptyEl.classList.toggle('is-visible', visible === 0);
    }

    render();
    tabsEl.addEventListener('click', (event) => {
      const tab = event.target.closest('.resource-tab');
      if (!tab) return;
      activeGroup = tab.dataset.group;
      applyFilter();
    });
    searchEl.addEventListener('input', applyFilter);
  </script>
