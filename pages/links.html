<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>友链 · 次元日记</title>
  <meta name="description" content="朋友站点、友链交换和站点留言入口。" />
  <meta name="theme-color" content="#120b18" />
  <link rel="canonical" href="https://yzh1019.top/pages/links.html" />
  <meta property="og:url" content="https://yzh1019.top/pages/links.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="次元日记" />
  <meta property="og:title" content="友链 · 次元日记" />
  <meta property="og:description" content="朋友站点、友链交换和站点留言入口。" />
  <meta property="og:image" content="https://yzh1019.top/assets/avatar.webp" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="stylesheet" href="../css/main.css" />
  <script src="../js/site-shell.js" defer></script>
</head>
<body data-root-prefix="../" data-active-nav="links" data-loader-text="加载友链中...">
  <div id="site-shell-top"></div>
  <main class="site-wrapper" id="main-content" tabindex="-1">
    <section class="page-hero reveal">
      <div class="section-label">Friends</div>
      <h1>友链</h1>
      <p>把朋友们的站点放在这里，也欢迎长期维护个人站的同好来交换链接。</p>
    </section>

    <section class="links-layout">
      <div class="links-main">
        <div class="section-header">
          <div class="section-label">Blogroll</div>
          <h2>朋友站点</h2>
        </div>
        <div class="friend-links" id="friend-links-list"></div>
      </div>

      <aside class="links-side">
        <section class="message-panel reveal">
          <div class="section-label">Exchange</div>
          <h2>交换友链</h2>
          <p>申请友链时建议带上站点名称、主页地址、头像、简介和 RSS 地址。</p>
          <div class="contact-list" id="contact-list"></div>
          <div class="content-actions" id="contact-actions" style="justify-content:flex-start"></div>
        </section>
      </aside>
    </section>

    <section class="message-panel comment-box reveal">
      <div class="section-label">Comments</div>
      <h2>免登录留言</h2>
      <p>这里不要求登录账号。填写后会通过静态表单服务发送给站长，适合友链申请和站点反馈。</p>
      <form class="message-form" id="friend-message-form">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="box">
        <input type="hidden" name="_subject" value="友链交换 / 站点留言">
        <input type="hidden" name="_cc" value="">
        <label>
          <span>称呼</span>
          <input name="name" type="text" autocomplete="name" placeholder="你的昵称或站点名" required>
        </label>
        <label>
          <span>联系方式</span>
          <input name="contact" type="text" autocomplete="email" placeholder="邮箱、主页或其他联系方式">
        </label>
        <label>
          <span>留言内容</span>
          <textarea name="message" rows="6" placeholder="友链信息、站点反馈或想说的话" required></textarea>
        </label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">提交留言</button>
          <button class="btn btn-ghost" type="button" id="copy-message">复制内容</button>
        </div>
        <p class="form-note" id="message-form-note">没有自建后端时，公开评论无法可靠保存；这里会把留言发送到站长邮箱。</p>
      </form>
    </section>
  </main>
  <div id="site-shell-bottom"></div>
  <script src="../js/data.js?v=20260601-5" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/pages/links.js?v=20260601-5" defer></script>
</body>
</html>
