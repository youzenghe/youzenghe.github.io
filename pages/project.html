  <style>
    .project-detail { padding: 8rem 0 5rem; }
    .project-detail-head { max-width: 820px; margin-bottom: 2rem; }
    .project-detail-title { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.15; margin-bottom: 1rem; }
    .project-detail-desc { color: var(--text-muted); line-height: 1.9; max-width: 720px; }
    .project-detail-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.2rem 0; }
    .project-detail-cover { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--glass-border); background: var(--card-bg); margin-bottom: 2rem; }
    .project-detail-cover img { width: 100%; max-height: 520px; object-fit: contain; background: rgba(0,0,0,0.18); }
    .project-detail-grid { display: grid; grid-template-columns: 1fr 280px; gap: 2rem; align-items: start; }
    .project-detail-body { padding: 1.4rem; border-radius: var(--radius); background: var(--card-bg); border: 1px solid var(--glass-border); line-height: 1.9; color: var(--text-muted); }
    .project-detail-body h2 { color: var(--text); font-family: var(--font-display); margin: 1.4rem 0 0.6rem; }
    .project-detail-body p { margin-bottom: 1rem; }
    .project-detail-body ul { margin: 0 0 1rem 1.2rem; color: var(--text-muted); }
    .project-detail-body li { margin-bottom: 0.35rem; }
    .project-detail-body .md-image { margin: 1.4rem 0; }
    .project-detail-body .md-image img { width: 100%; max-height: 620px; object-fit: contain; border-radius: var(--radius-sm); border: 1px solid var(--glass-border); background: rgba(0,0,0,0.16); display: block; }
    .project-detail-body .md-image figcaption { margin-top: 0.45rem; color: var(--text-muted); font-size: 0.78rem; line-height: 1.6; text-align: center; }
    .project-detail-body .md-inline-image { max-width: min(100%, 520px); max-height: 340px; object-fit: contain; border-radius: var(--radius-sm); border: 1px solid var(--glass-border); vertical-align: middle; margin: 0.4rem 0; display: inline-block; }
    .project-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.8rem; margin-top: 1.2rem; }
    .project-gallery figure { margin: 0; }
    .project-gallery img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--glass-border); }
    .project-gallery figcaption { margin-top: 0.35rem; color: var(--text-muted); font-size: 0.76rem; line-height: 1.6; }
    .project-side { position: sticky; top: 90px; padding: 1.2rem; border-radius: var(--radius); background: var(--card-bg); border: 1px solid var(--glass-border); }
    .project-side-title { font-family: var(--font-display); margin-bottom: 0.8rem; }
    .project-links { display: flex; flex-direction: column; gap: 0.45rem; margin-top: 1rem; }
    .project-links a { color: var(--sakura); font-size: 0.84rem; }
    @media (max-width: 860px) { .project-detail-grid { grid-template-columns: 1fr; } .project-side { position: static; } }
  </style>
</head>
<body data-root-prefix="../" data-active-nav="projects" data-loader-text="加载项目中...">
  <div id="site-shell-top"></div>
  <main class="site-wrapper" id="main-content" tabindex="-1">
    <article class="project-detail">
      <div class="project-detail-head reveal" id="project-detail-head"></div>
      <div class="project-detail-cover reveal" id="project-detail-cover"></div>
      <div class="project-detail-grid">
        <section class="project-detail-body reveal" id="project-detail-body"></section>
        <aside class="project-side reveal reveal-delay-1">
          <div class="project-side-title">项目档案</div>
          <div id="project-detail-side"></div>
        </aside>
      </div>
    </article>
  </main>
  <div id="site-shell-bottom"></div>

  <script src="../js/main.js" defer></script>
  <script src="../js/pages/project-detail.js" defer></script>
