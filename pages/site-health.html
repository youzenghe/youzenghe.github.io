<head>

  <meta name="twitter:image" content="https://yzh1019.top/assets/avatar.webp" />

  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="stylesheet" href="../css/main.css" />
  <script src="../js/site-shell.js" defer></script>
  <style>
    .health-page { padding-bottom: 6rem; }
    .health-hero {
      max-width: 1040px;
      margin: 0 auto 2rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 1.2rem;
      align-items: stretch;
    }
    .health-hero-copy,
    .health-status-orb,
    .health-panel,
    .health-check-card {
      border: 1px solid var(--glass-border);
      background: rgba(13,18,34,0.62);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 42px var(--shadow);
    }
    .health-hero-copy {
      padding: 2rem;
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }
    .health-hero-copy::after {
      content: "";
      position: absolute;
      inset: auto 1.2rem 1.2rem auto;
      width: 128px;
      height: 128px;
      border: 1px solid rgba(82,224,224,0.22);
      border-radius: 50%;
      background:
        linear-gradient(90deg, transparent 48%, rgba(82,224,224,0.18) 49%, rgba(82,224,224,0.18) 51%, transparent 52%),
        linear-gradient(0deg, transparent 48%, rgba(82,224,224,0.18) 49%, rgba(82,224,224,0.18) 51%, transparent 52%);
      opacity: 0.55;
      pointer-events: none;
    }
    .health-kicker {
      display: inline-flex;
      gap: 0.45rem;
      align-items: center;
      margin-bottom: 1rem;
      color: var(--accent);
      font-family: var(--font-ui);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .health-kicker::before {
      content: "";
      width: 0.48rem;
      height: 0.48rem;
      border-radius: 50%;
      background: var(--sakura);
      box-shadow: 0 0 16px rgba(255,111,181,0.9);
    }
    .health-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.4rem);
      margin-bottom: 0.9rem;
    }
    .health-hero p {
      max-width: 620px;
      color: var(--text-muted);
      line-height: 1.85;
    }
    .health-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 1.25rem;
    }
    .health-chip {
      display: inline-flex;
      align-items: center;
      min-height: 2rem;
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(91,157,255,0.24);
      background: rgba(91,157,255,0.1);
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.76rem;
    }
    .health-status-orb {
      border-radius: var(--radius);
      padding: 1.4rem;
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .health-status-orb::before {
      content: "";
      width: 156px;
      height: 156px;
      border-radius: 50%;
      border: 1px solid rgba(82,224,224,0.26);
      background:
        radial-gradient(circle at 50% 50%, rgba(82,224,224,0.18), transparent 58%),
        conic-gradient(from 210deg, rgba(82,224,224,0.72), rgba(251,191,36,0.65), rgba(255,111,181,0.72), rgba(82,224,224,0.72));
      filter: drop-shadow(0 0 28px rgba(82,224,224,0.18));
      opacity: 0.85;
    }
    .health-status-orb[data-status="warning"]::before {
      background:
        radial-gradient(circle at 50% 50%, rgba(251,191,36,0.2), transparent 58%),
        conic-gradient(from 210deg, rgba(251,191,36,0.78), rgba(255,111,181,0.55), rgba(82,224,224,0.58), rgba(251,191,36,0.78));
    }
    .health-status-orb[data-status="error"]::before {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,111,181,0.22), transparent 58%),
        conic-gradient(from 210deg, rgba(255,111,181,0.85), rgba(251,191,36,0.55), rgba(91,157,255,0.58), rgba(255,111,181,0.85));
    }
    .health-status-text {
      position: absolute;
      display: grid;
      gap: 0.2rem;
    }
    .health-status-text strong {
      font-family: var(--font-display);
      font-size: 1.6rem;
    }
    .health-status-text span {
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.72rem;
    }
    .health-grid {
      max-width: 1040px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 1.2rem;
      align-items: start;
    }
    .health-panel {
      border-radius: var(--radius);
      padding: 1.2rem;
    }
    .health-panel h2 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }
    .health-check-list {
      display: grid;
      gap: 0.75rem;
    }
    .health-check-card {
      border-radius: var(--radius-sm);
      padding: 0.95rem 1rem;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.75rem;
      align-items: start;
    }
    .health-dot {
      width: 0.7rem;
      height: 0.7rem;
      margin-top: 0.35rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(82,224,224,0.7);
    }
    .health-check-card[data-status="warn"] .health-dot {
      background: #fbbf24;
      box-shadow: 0 0 16px rgba(251,191,36,0.68);
    }
    .health-check-card[data-status="fail"] .health-dot {
      background: var(--sakura);
      box-shadow: 0 0 16px rgba(255,111,181,0.72);
    }
    .health-check-title {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
      font-weight: 800;
    }
    .health-check-title span:last-child {
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .health-check-detail {
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.65;
    }
    .health-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .health-metric {
      padding: 0.9rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.045);
    }
    .health-metric strong {
      display: block;
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }
    .health-metric span {
      color: var(--text-muted);
      font-size: 0.76rem;
    }
    .health-list {
      display: grid;
      gap: 0.7rem;
      color: var(--text-muted);
      line-height: 1.7;
      font-size: 0.84rem;
    }
    .health-list-item {
      padding: 0.75rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.04);
    }
    .health-list-item strong {
      color: var(--text);
      display: block;
      margin-bottom: 0.2rem;
    }
    @media (max-width: 860px) {
      .health-hero,
      .health-grid {
        grid-template-columns: 1fr;
      }
      .health-status-orb {
        min-height: 220px;
      }
    }
    @media (max-width: 520px) {
      .health-hero-copy,
      .health-panel {
        padding: 1rem;
      }
      .health-metrics {
        grid-template-columns: 1fr;
      }
      .health-check-card {
        grid-template-columns: 1fr;
      }
      .health-dot {
        margin-top: 0;
      }
    }
  </style>
</head>
<body data-root-prefix="../" data-active-nav="" data-loader-text="校准巡检终端中...">
  <div id="site-shell-top"></div>
  <main class="site-wrapper health-page" id="main-content" tabindex="-1">
    <section class="health-hero reveal" aria-labelledby="health-title">
      <div class="health-hero-copy">
        <div class="health-kicker">Site Health Console</div>
        <h1 id="health-title">站点健康报告</h1>
        <p>这里记录博客的自动巡检结果：数据拆分、搜索覆盖、背景视频规则、SEO 基础文件、内容资源引用和媒体体积。报告由本地脚本生成，页面只负责读取静态结果。</p>
        <div class="health-meta-row" id="health-meta"></div>
      </div>
      <div class="health-status-orb" id="health-status-orb" data-status="healthy" aria-label="站点总体状态">
        <div class="health-status-text">
          <strong id="health-status-label">读取中</strong>
          <span id="health-status-subtitle">等待巡检数据</span>
        </div>
      </div>
    </section>

    <section class="health-grid">
      <div class="health-panel reveal">
        <h2>巡检项目</h2>
        <div class="health-check-list" id="health-check-list"></div>
      </div>
      <div class="health-panel reveal">
        <h2>关键指标</h2>
        <div class="health-metrics" id="health-metrics"></div>
        <h2 style="margin-top:1.4rem">处理建议</h2>
        <div class="health-list" id="health-recommendations"></div>
      </div>
    </section>
  </main>
  <div id="site-shell-bottom"></div>
  <script src="../js/data-core.js" defer></script>
  <script src="../js/data-site-health.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/pages/site-health.js" defer></script>
</body>
</html>
