  <script id="posts-structured-data" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "url": "https://yzh1019.top/pages/posts.html",
      "name": "文章 · 次元日记",
      "description": "浏览技术笔记、项目复盘、竞赛记录和 ACG 相关随笔。"
    }

  <style>
    .posts-layout {
      padding-bottom: 5rem;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
    }
    .filter-btn {
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
    }
    .filter-btn.active,
    .filter-btn:hover {
      background: var(--sakura-deep);
      color: #fff;
      border-color: transparent;
    }
    .posts-masonry {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 0 0.2rem;
    }
    .post-list-card {
      display: flex;
      flex-direction: row;
      padding: 0;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      transition: transform 0.25s, box-shadow 0.25s;
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      min-height: 180px;
    }
    .post-list-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px var(--shadow);
    }
    .plc-thumb {
      width: 280px;
      min-width: 280px;
      height: 100%;
      border-radius: 0;
      background: linear-gradient(135deg, rgba(249,168,201,0.15), rgba(192,132,252,0.15));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }
    .plc-thumb .img-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(0.55) saturate(1.2);
      transform: scale(1.1);
    }
    .plc-thumb img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .plc-content {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .plc-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: var(--font-ui);
    }
    .plc-meta > span {
      white-space: nowrap;
    }
    .plc-cat {
      display: inline-flex;
      align-items: center;
      padding: 0.12rem 0.5rem;
      border-radius: 1rem;
      background: var(--glass);
      white-space: nowrap;
    }
    .plc-flag {
      display: inline-flex;
      align-items: center;
      padding: 0.1rem 0.45rem;
      border-radius: 1rem;
      background: rgba(103,232,249,0.12);
      color: var(--accent2);
      border: 1px solid rgba(103,232,249,0.18);
      white-space: nowrap;
    }
    .plc-title {
      font-family: var(--font-display);
      font-size: 1rem;
      line-height: 1.4;
    }
    .plc-excerpt {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .plc-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.4rem;
    }
    .plc-tag {
      font-size: 0.65rem;
      padding: 0.1rem 0.5rem;
      border-radius: 1rem;
      background: var(--glass);
      color: var(--text-muted);
    }

    .sidebar-widget {
      margin-bottom: 1.5rem;
      padding: 1.3rem;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
    }
    .sw-title {
      font-family: var(--font-display);
      font-size: 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .sw-tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .sw-tag {
      padding: 0.25rem 0.7rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
    }
    .sw-tag:hover {
      color: var(--sakura);
      border-color: var(--sakura-deep);
    }
    .sw-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .sw-list a {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      transition: color var(--transition);
      text-decoration: none;
    }
    .sw-list a:hover { color: var(--sakura); }
    .sw-list-num {
      flex-shrink: 0;
      width: 1.2rem;
      height: 1.2rem;
      border-radius: 50%;
      background: var(--glass);
      font-size: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.05rem;
    }
    .sw-series-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .sw-series-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      background: var(--glass);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .sw-series-btn:hover,
    .sw-series-btn.active {
      background: var(--glass-mid);
      border-color: var(--sakura-deep);
      color: var(--sakura);
    }
    .sw-series-count {
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 0.72rem;
    }
    .no-results {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    .no-results span {
      font-size: 3rem;
      display: block;
      margin-bottom: 0.8rem;
    }

    @media (max-width: 1024px) {
      .plc-thumb {
        width: 240px;
        min-width: 240px;
      }
    }
    @media (max-width: 860px) {
      .post-list-card {
        flex-direction: column;
        min-height: auto;
      }
      .plc-thumb {
        width: 100%;
        min-width: 100%;
        aspect-ratio: 16/9;
      }
    }
    @media (max-width: 560px) {
      .plc-thumb {
        font-size: 2rem;
      }
      .plc-content {
        padding: 1rem;
      }
      .plc-title {
        font-size: 0.92rem;
      }
      .plc-meta {
        gap: 0.28rem 0.42rem;
        font-size: 0.66rem;
      }
      .plc-cat,
      .plc-flag {
        padding-inline: 0.42rem;
      }
      .plc-excerpt {
        font-size: 0.74rem;
        -webkit-line-clamp: 2;
      }
      .plc-tags {
        margin-top: 0.3rem;
      }
    }
  </style>
</head>

        <button class="filter-btn active" data-cat="全部">全部</button>
        <button class="filter-btn" data-cat="荣誉证明">🏆 荣誉证明</button>
        <button class="filter-btn" data-cat="趣味生活">🌸 趣味生活</button>
      </div>
      <div class="posts-masonry" id="posts-list"></div>
    </div>
  </main>

  <script src="../js/data.js" defer></script>
  <script src="../js/main.js" defer></script>

</html>
