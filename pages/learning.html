    .study-card:focus-visible {

      outline-offset: 4px;

      border-color: rgba(82,224,224,0.62);

    }
    .study-preview {

      inset-inline-end: 0;
      top: 0;

    .study-footer {

    .learning-detail-meta span {

      font-size: 0.92rem;
    }
    .learning-detail-cover {
      position: relative;
      min-height: 100%;
      overflow: hidden;
      opacity: 0.76;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.34) 28%, #000 70%);
      mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.34) 28%, #000 70%);
    }
    .learning-detail-cover::before {
      content: "";

      z-index: 1;

      -webkit-mask-image: linear-gradient(to right, #000 0%, rgba(0,0,0,0.58) 32%, transparent 68%);

    .learning-detail-cover img {

      height: 100%;

      object-fit: cover;
      display: block;

      display: grid;

      align-items: start;

    .learning-detail-main {
      min-width: 0;
      display: flex;
      flex-direction: column;

    }
    .learning-detail-cards {

      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;

    .learning-detail-body {

      padding: 1.6rem;
      border-radius: var(--radius);
      background: var(--card-bg);

      line-height: 1.95;
      backdrop-filter: blur(12px);

    .learning-detail-body h1,

      padding-left: 0.8rem;
      border-left: 3px solid var(--sakura-deep);
      line-height: 1.35;
      scroll-margin-top: 96px;

    .learning-detail-body h1 { font-size: 1.55rem; }
    .learning-detail-body h2 { font-size: 1.35rem; }
    .learning-detail-body h3,
    .learning-detail-body h4 {
      font-family: var(--font-display);
      margin: 1.5rem 0 0.6rem;
      line-height: 1.4;
      scroll-margin-top: 96px;
    }
    .learning-detail-body h3 { font-size: 1.08rem; }
    .learning-detail-body h4 { font-size: 0.98rem; }

    .learning-detail-body ul,
    .learning-detail-body ol,
    .learning-detail-body blockquote,
    .learning-detail-body .code-block,
    .learning-detail-body .md-table {
      margin-bottom: 1.1rem;
    }
    .learning-detail-body ul,
    .learning-detail-body ol {
      padding-left: 1.3rem;
      color: var(--text-muted);
    }
    .learning-detail-body li { margin-bottom: 0.36rem; }
    .learning-detail-body p { color: var(--text-muted); }
    .learning-detail-body blockquote {
      padding: 1rem 1.2rem;
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--glass);
      color: var(--text);
    }
    .learning-detail-body code:not(pre code) {
      padding: 0.08rem 0.32rem;
      border-radius: 0.35rem;
      background: rgba(82,224,224,0.12);
      color: var(--accent2);
      font-size: 0.9em;
    }
    .learning-detail-body a { color: var(--sakura); }
    .learning-detail-body hr {
      border: 0;
      border-top: 1px solid var(--glass-border);
      margin: 1.7rem 0;
    }
    .learning-detail-body .md-table {
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
    }
    .learning-detail-body table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 0.86rem;
    }
    .learning-detail-body th,
    .learning-detail-body td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--glass-border);
      text-align: left;
      vertical-align: top;
    }
    .learning-detail-body th {
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }
    .learning-detail-body .md-image { margin: 1.5rem 0; }
    .learning-detail-body .md-image img {
      width: 100%;
      max-height: 680px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.16);
      display: block;

    .learning-detail-body .md-image figcaption {
      margin-top: 0.45rem;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-align: center;
    }
    .learning-detail-body .md-inline-image {
      max-width: min(100%, 520px);
      max-height: 360px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      vertical-align: middle;
      margin: 0.4rem 0;
      display: inline-block;
    }
    .learning-detail-body .code-block {

      border: 1px solid var(--glass-border);
      background: rgba(12, 14, 18, 0.72);
      overflow: hidden;

      font-family: var(--font-ui);

    .learning-detail-body .code-token-keyword { color: #5b9dff; }
    .learning-detail-body .code-token-string { color: #52e0e0; }

    .learning-side-card {

      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--glass-border);

      overflow: hidden;

    .learning-toc-card {
      display: flex;
      height: 100%;

    }
    .learning-side-title {

    .learning-toc {

      scrollbar-color: rgba(91,157,255,0.55) transparent;

    .learning-toc-list {
      display: flex;

    .learning-toc-list li {
      margin: 0;
      padding: 0;

    .learning-toc a,

      color: var(--text-muted);

    .learning-related {

      flex-direction: column;
      gap: 0.7rem;
      min-width: 0;
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.65;

    .learning-related span {
      overflow-wrap: anywhere;
    }
    .learning-detail-empty {
      padding: 2rem;
      color: var(--text-muted);
      text-align: center;
    }
    .learning-empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .learning-empty span {
      display: block;
      margin-bottom: 0.8rem;
      font-size: 3rem;
    }
    @media (max-width: 1024px) {
      .study-card {

        --content-safe-width: calc(100% - var(--preview-width) + 72px);
      }
      .study-preview {
        width: var(--preview-width);
        min-width: 280px;
      }
      .learning-detail-layout { grid-template-columns: 1fr; }
      .learning-detail-side,
      .learning-toc-card,
      .learning-toc {
        position: static;
        height: auto;
        min-height: 0;
        max-height: none;
      }
    }
    @media (max-width: 680px) {
      .learning-detail-hero {
        grid-template-columns: 1fr;
      }
      .learning-detail-cover {
        grid-row: 1;
        aspect-ratio: 16 / 9;
        -webkit-mask-image: none;
        mask-image: none;
      }
      .learning-detail-cover::before { display: none; }
      .learning-detail-copy {
        grid-row: 2;
        padding: 1.2rem 1rem;
      }
      .learning-detail-cards {
        grid-template-columns: 1fr;
      }
      .learning-detail-body { padding: 1.1rem 1rem; }
      .study-card {
        --preview-width: 100%;
        --content-safe-width: 100%;
        min-height: auto;
      }
      .study-preview {
        position: relative;
        width: 100%;
        min-width: 100%;

        opacity: 1;
        -webkit-mask-image: none;
        mask-image: none;
      }
      .study-preview::before {
        display: none;
      }
      .study-body,

        width: 100%;
        max-width: 100%;
        background: var(--card-bg);
      }
      .study-body {
        padding: 1.1rem 1rem 0.55rem;
      }
      .study-footer {
        padding: 0.25rem 1rem 1rem;
      }
    }
    @media (max-width: 520px) {
      .learning-summary { padding: 1.1rem 1rem; }
      .learning-stat { min-width: 70px; }
      .study-title { font-size: 0.98rem; }
      .study-excerpt {
        font-size: 0.74rem;
        -webkit-line-clamp: 2;
      }
