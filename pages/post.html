<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章详情 · 次元日记</title>
  <meta name="description" content="阅读次元日记中的单篇文章内容，浏览目录、标签与相关文章。" />
  <meta name="theme-color" content="#120b18" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="文章详情 · 次元日记" />
  <meta property="og:description" content="阅读次元日记中的单篇文章内容，浏览目录、标签与相关文章。" />
  <meta property="og:image" content="../assets/avatar.png" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="文章详情 · 次元日记" />
  <meta name="twitter:description" content="阅读次元日记中的单篇文章内容，浏览目录、标签与相关文章。" />
  <meta name="twitter:image" content="../assets/avatar.png" />
  <link rel="icon" type="image/png" href="../assets/avatar.png" />
  <link rel="stylesheet" href="../css/main.css" />
  <script src="../js/site-shell.js"></script>
  <style>
    .post-layout {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 2.5rem;
      padding-bottom: 5rem;
      align-items: start;
    }
    .post-main { min-width: 0; }
    .post-header { padding: 8rem 0 2rem; }
    .post-header-cat {
      display: inline-block;
      padding: 0.25rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--sakura);
      margin-bottom: 1rem;
    }
    .post-header h1 {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .post-header-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-family: 'Raleway', sans-serif;
    }
    .post-cover {
      width: 100%;
      min-height: 260px;
      max-height: 520px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      margin-bottom: 2.5rem;
      border: 1px solid var(--glass-border);
      overflow: hidden;
      position: relative;
    }
    .post-cover .img-bg {
      position: absolute;
      inset: -10px;
      background-size: cover;
      background-position: center;
      filter: blur(22px) brightness(0.5) saturate(1.3);
      transform: scale(1.05);
    }
    .post-cover img {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 500px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .post-body {
      font-size: 1rem;
      line-height: 1.95;
      color: var(--text);
    }
    .post-body h2 {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1.5rem;
      margin: 2.2rem 0 0.8rem;
      padding-left: 0.8rem;
      border-left: 3px solid var(--sakura-deep);
      color: var(--text);
    }
    .post-body p { margin-bottom: 1.2rem; }
    .post-body blockquote {
      margin: 1.5rem 0;
      padding: 1rem 1.5rem;
      border-left: 3px solid var(--accent);
      background: var(--glass);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-muted);
      font-style: italic;
    }
    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 2rem 0;
    }
    .post-tag {
      padding: 0.28rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
    }
    .post-reading-note {
      margin-top: 2rem;
      padding: 1rem 1.2rem;
      border-radius: var(--radius-sm);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.8;
    }

    .post-sidebar {
      position: sticky;
      top: 90px;
    }
    .toc-list { list-style: none; }
    .toc-list li { padding: 0.3rem 0; }
    .toc-list a {
      font-size: 0.82rem;
      color: var(--text-muted);
      transition: color var(--transition);
      display: block;
      padding-left: 0.5rem;
      border-left: 2px solid transparent;
    }
    .toc-list a:hover,
    .toc-list a.active {
      color: var(--sakura);
      border-left-color: var(--sakura);
    }
    .sidebar-widget {
      margin-bottom: 1.5rem;
      padding: 1.3rem;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
    }
    .sw-title {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .related-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .related-item {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      transition: color var(--transition);
    }
    .related-item:hover { color: var(--sakura); }
    .related-emoji {
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .prev-next {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 2.5rem;
    }
    .pn-card {
      padding: 1rem 1.2rem;
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      color: var(--text);
      transition: background var(--transition);
    }
    .pn-card:hover { background: var(--glass-mid); }
    .pn-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      font-family: 'Raleway', sans-serif;
      margin-bottom: 0.3rem;
    }
    .pn-title {
      font-size: 0.85rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pn-card.next { text-align: right; }

    @media (max-width: 860px) {
      .post-layout { grid-template-columns: 1fr; }
      .post-sidebar { position: static; }
    }
    @media (max-width: 480px) {
      .prev-next { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-root-prefix="../" data-active-nav="posts" data-loader-text="加载中..." data-footer-html="&lt;a href=&quot;posts.html&quot;&gt;← 返回文章列表&lt;/a&gt;">
  <div id="site-shell-top"></div>

  <div class="site-wrapper">
    <div class="post-header reveal" id="post-header"></div>
    <div class="post-layout">
      <article class="post-main">
        <div class="post-cover" id="post-cover"></div>
        <div class="post-body reveal" id="post-body"></div>
        <div class="post-tags reveal" id="post-tags"></div>
        <div class="prev-next reveal" id="prev-next"></div>
        <div class="post-reading-note reveal">文章到这里就结束啦，去看看相关文章，或者继续逛逛别的页面吧。</div>
      </article>

      <aside class="post-sidebar">
        <div class="sidebar-widget reveal">
          <div class="sw-title">目录</div>
          <ul class="toc-list" id="toc"></ul>
        </div>
        <div class="sidebar-widget reveal reveal-delay-1">
          <div class="sw-title">相关文章</div>
          <div class="related-list" id="related"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="site-shell-bottom"></div>

  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/pages/post-detail.js"></script>
</body>
</html>
