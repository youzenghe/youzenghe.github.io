  <style>
    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 3px;
      z-index: 1200;
      background: linear-gradient(90deg, var(--sakura-deep), var(--accent2));
      transition: width 0.08s linear;
    }
    .post-layout {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 2.5rem;
      padding-bottom: 5rem;
      align-items: start;
    }
    .post-main { min-width: 0; }
    .post-header { padding: 8rem 0 2rem; }
    .post-header-cat {
      display: inline-block;
      padding: 0.25rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--sakura);
      margin-bottom: 1rem;
    }
    .post-header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .post-header-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-family: var(--font-ui);
    }
    .post-cover {
      width: 100%;
      min-height: 260px;
      max-height: 520px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      margin-bottom: 2.5rem;
      border: 1px solid var(--glass-border);
      overflow: hidden;
      position: relative;
    }
    .post-cover .img-bg {
      position: absolute;
      inset: -10px;
      background-size: cover;
      background-position: center;
      filter: blur(22px) brightness(0.5) saturate(1.3);
      transform: scale(1.05);
    }
    .post-cover img {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 500px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .post-body {
      font-size: 1rem;
      line-height: 1.95;
      color: var(--text);
    }
    .post-body h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin: 2.2rem 0 0.8rem;
      padding-left: 0.8rem;
      border-left: 3px solid var(--sakura-deep);
      color: var(--text);
    }
    .post-body p { margin-bottom: 1.2rem; }
    .post-body blockquote {
      margin: 1.5rem 0;
      padding: 1rem 1.5rem;
      border-left: 3px solid var(--accent);
      background: var(--glass);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-muted);
      font-style: italic;
    }
    .post-body .md-image {
      margin: 1.6rem 0;
    }
    .post-body .md-image img {
      width: 100%;
      max-height: 680px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.16);
      display: block;
    }
    .post-body .md-image figcaption {
      margin-top: 0.45rem;
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.6;
      text-align: center;
    }
    .post-body .md-inline-image {
      max-width: min(100%, 520px);
      max-height: 360px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      vertical-align: middle;
      margin: 0.4rem 0;
      display: inline-block;
    }
    .post-body h3 {
      font-family: var(--font-display);
      font-size: 1.18rem;
      margin: 1.6rem 0 0.6rem;
      color: var(--text);
    }
    .code-block {
      margin: 1.5rem 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(12, 14, 18, 0.72);
      overflow: hidden;
    }
    .code-block figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.55rem 0.8rem;
      border-bottom: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-family: var(--font-ui);
    }
    .copy-code-btn {
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text);
      border-radius: 999px;
      padding: 0.22rem 0.65rem;
      cursor: pointer;
      font-size: 0.72rem;
    }
    .copy-code-btn:hover { background: var(--glass-mid); }
    .code-block pre {
      margin: 0;
      padding: 1rem;
      overflow-x: auto;
      line-height: 1.7;
    }
    .code-block code {
      font-family: "JetBrains Mono Variable", "JetBrains Mono", Consolas, "Cascadia Code", ui-monospace, monospace;
      font-size: 0.84rem;
      color: #dbe4f2;
    }
    .code-token-keyword { color: #5b9dff; }
    .code-token-string { color: #52e0e0; }
    .code-token-comment { color: rgba(237,228,245,0.46); }
    .post-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.8rem;
      margin: 2rem 0;
    }
    .post-gallery img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: var(--glass);
    }
    .post-gallery figure { margin: 0; }
    .post-gallery figcaption {
      margin-top: 0.35rem;
      color: var(--text-muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }
    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 2rem 0;
    }
    .post-tag {
      padding: 0.28rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
    }
    .post-reading-note {
      margin-top: 2rem;
      padding: 1rem 1.2rem;
      border-radius: var(--radius-sm);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.8;
    }
    .back-to-top {
      position: fixed;
      right: 280px;
      bottom: 1.4rem;
      z-index: 10000;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease, background var(--transition);
      backdrop-filter: blur(12px);
    }
    .back-to-top.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .back-to-top:hover { background: var(--glass-mid); }

    .post-sidebar {
      position: sticky;
      top: 90px;
    }
    .toc-toggle {
      display: none;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 0.8rem;
    }
    .toc-list { list-style: none; }
    .toc-list li { padding: 0.3rem 0; }
    .toc-list a {
      font-size: 0.82rem;
      color: var(--text-muted);
      transition: color var(--transition);
      display: block;
      padding-left: 0.5rem;
      border-left: 2px solid transparent;
    }
    .toc-list a:hover,
    .toc-list a.active {
      color: var(--sakura);
      border-left-color: var(--sakura);
    }
    .sidebar-widget {
      margin-bottom: 1.5rem;
      padding: 1.3rem;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
    }
    .sw-title {
      font-family: var(--font-display);
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .related-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .related-item {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      transition: color var(--transition);
    }
    .related-item:hover { color: var(--sakura); }
    .related-emoji {
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .prev-next {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 2.5rem;
    }
    .pn-card {
      padding: 1rem 1.2rem;
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      color: var(--text);
      transition: background var(--transition);
    }
    .pn-card:hover { background: var(--glass-mid); }
    .pn-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      font-family: var(--font-ui);
      margin-bottom: 0.3rem;
    }
    .pn-title {
      font-size: 0.85rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pn-card.next { text-align: right; }

    @media (max-width: 860px) {
      .post-layout { grid-template-columns: 1fr; }
      .post-sidebar { position: static; }
      .toc-toggle { display: flex; }
      .toc-list { display: none; }
      .toc-list.open { display: block; }
    }
    @media (max-width: 768px) {
      .back-to-top { right: 1rem; bottom: 1rem; }
    }
    @media (max-width: 480px) {
      .post-cover {
        min-height: 200px;
        margin-bottom: 1.6rem;
      }
      .post-cover .img-bg {
        inset: -6px;
        filter: blur(14px) brightness(0.52) saturate(1.15);
      }
      .post-cover img {
        width: 100%;
        height: 100%;
        max-height: 280px;
        object-fit: contain;
        object-position: center;
      }
      .prev-next { grid-template-columns: 1fr; }
    }
  </style>
</head>

      </aside>
