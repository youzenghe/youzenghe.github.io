  <style>
    .project-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.82rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--sakura-deep), var(--accent));
      color: #fff;
      border-color: transparent;
    }
    .stats-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      padding: 1.5rem 2rem;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      margin-bottom: 2.5rem;
    }
    .sum-item { text-align: center; }
    .sum-num {
      font-family: var(--font-ui);
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--sakura), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .sum-label { font-size: 0.72rem; color: var(--text-muted); }
    .project-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 0 0.2rem;
    }
    .proj-card {
      --preview-width: min(58%, 460px);
      --content-safe-width: calc(100% - var(--preview-width) + 96px);
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      min-height: 200px;
    }
    .proj-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px var(--shadow);
    }
    .proj-preview {
      position: absolute;
      inset-inline-end: 0;
      top: 0;
      width: var(--preview-width);
      height: 100%;
      overflow: hidden;
      cursor: zoom-in;
      background: linear-gradient(135deg, rgba(91,157,255,0.08), rgba(82,224,224,0.08));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
      opacity: 0.5;
      -webkit-mask-image: linear-gradient(to right, transparent 8%, rgba(0,0,0,0.4) 45%, #000 82%);
      mask-image: linear-gradient(to right, transparent 8%, rgba(0,0,0,0.4) 45%, #000 82%);
      transition: opacity 0.4s ease;
    }
    .proj-card:hover .proj-preview { opacity: 0.75; }
    .proj-preview::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      -webkit-mask-image: linear-gradient(to right, #000 0%, #000 30%, rgba(0,0,0,0.55) 48%, transparent 70%);
      mask-image: linear-gradient(to right, #000 0%, #000 30%, rgba(0,0,0,0.55) 48%, transparent 70%);
      background: linear-gradient(
        to right,
        var(--card-bg) 0%,
        rgba(28, 25, 30, 0.9) 14%,
        rgba(28, 25, 30, 0.56) 34%,
        rgba(28, 25, 30, 0.12) 58%,
        transparent 82%
      );
    }
    .proj-preview img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }
    .proj-preview:hover img { transform: scale(1.05); }
    .proj-preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--text-muted);
      width: 100%;
      height: 100%;
      padding: 1.5rem;
      text-align: center;
    }
    .proj-preview-placeholder .p-emoji { font-size: 2.8rem; }
    .proj-preview-placeholder .p-hint { font-size: 0.68rem; opacity: 0.5; }
    /* 点击放大遮罩已移除，改为融合式半透明显示，hover 自然提亮 */
    .proj-body {
      position: relative;
      z-index: 1;
      width: min(70%, var(--content-safe-width));
      max-width: var(--content-safe-width);
      padding: 1.5rem 1.8rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex: 1;
    }
    .proj-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.8rem;
    }
    .proj-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      line-height: 1.3;
      flex: 1;
    }
    .proj-award {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.18rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.65rem;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: var(--font-ui);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .award-gold { background: rgba(251,191,36,0.2); color: #f59e0b; border: 1px solid rgba(251,191,36,0.3); }
    .award-silver { background: rgba(148,163,184,0.2); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
    .award-bronze { background: rgba(180,120,80,0.2); color: #c97c4a; border: 1px solid rgba(180,120,80,0.3); }
    .award-none { background: var(--glass); color: var(--text-muted); border: 1px solid var(--glass-border); }
    .proj-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.75; }
    .proj-meta-row { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
    .proj-cat {
      padding: 0.18rem 0.65rem;
      border-radius: 1rem;
      font-size: 0.7rem;
      background: rgba(91,157,255,0.15);
      color: var(--accent);
      border: 1px solid rgba(91,157,255,0.25);
    }
    .proj-tech-tag {
      padding: 0.15rem 0.55rem;
      border-radius: 1rem;
      font-size: 0.68rem;
      background: var(--glass);
      color: var(--text-muted);
      border: 1px solid var(--glass-border);
    }
    .proj-footer {
      position: relative;
      z-index: 1;
      width: min(70%, var(--content-safe-width));
      max-width: var(--content-safe-width);
      padding: 0.5rem 1.8rem 1.3rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1.2rem;
    }
    .proj-date {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--font-ui);
    }
    .proj-detail-link {
      flex-shrink: 0;
      font-size: 0.76rem;
      color: var(--sakura);
    }
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    #lightbox.open { display: flex; }
    .lb-wrap { position: relative; max-width: 960px; width: 100%; }
    .lb-img-box {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-img-box img { width: 100%; max-height: 78vh; object-fit: contain; display: block; }
    .lb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      max-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: var(--text-muted);
    }
    .lb-placeholder .lbp-emoji { font-size: 5rem; }
    .lb-placeholder .lbp-name { font-family: var(--font-display); font-size: 1.2rem; }
    .lb-placeholder .lbp-hint { font-size: 0.78rem; opacity: 0.5; }
    .lb-info {
      margin-top: 1rem;
      padding: 1rem 1.2rem;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .lb-info-left h3 { font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 0.3rem; }
    .lb-info-left p { font-size: 0.82rem; color: var(--text-muted); max-width: 540px; line-height: 1.7; }
    .lb-close {
      position: absolute;
      top: -2.8rem;
      right: 0;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: background var(--transition);
    }
    .lb-close:hover { background: var(--glass-mid); }
    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background var(--transition);
    }
    .lb-nav:hover { background: var(--glass-mid); }
    .lb-prev { left: -3.2rem; }
    .lb-next { right: -3.2rem; }
    .no-results { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    .no-results span { font-size: 3rem; display: block; margin-bottom: 0.8rem; }
    @media (max-width: 1024px) {
      .proj-card {
        --preview-width: 280px;
        --content-safe-width: calc(100% - var(--preview-width) + 72px);
      }
      .proj-preview {
        width: var(--preview-width);
        min-width: 280px;
      }
    }
    @media (max-width: 680px) {
      .proj-card {
        --preview-width: 100%;
        --content-safe-width: 100%;
        flex-direction: column;
        min-height: auto;
      }
      .proj-preview {
        position: relative;
        width: 100%;
        min-width: 100%;
        height: auto;
        aspect-ratio: 16/9;
        opacity: 1;
        -webkit-mask-image: none;
        mask-image: none;
      }
      .proj-preview::before {
        display: none;
      }
      .proj-body {
        width: 100%;
        background: var(--card-bg);
      }
      .lb-prev { left: -1rem; }
      .lb-next { right: -1rem; }
    }
    @media (max-width: 480px) {
      .lb-nav { width: 32px; height: 32px; font-size: 1rem; }
    }
  </style>
</head>
