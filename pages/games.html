  <style>
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.8rem;
      margin-top: 2rem;
    }
    .game-card {
      display: block;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      color: var(--text);
    }
    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px var(--shadow);
    }
    .game-card-img {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, rgba(91,157,255,0.1), rgba(91,157,255,0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      position: relative;
      overflow: hidden;
    }
    .game-card-img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .game-card-body { padding: 1.3rem; }
    .game-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      font-family: var(--font-ui);
    }
    .game-category {
      padding: 0.15rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.68rem;
      background: var(--glass);
      color: var(--sakura);
    }
    .game-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      line-height: 1.4;
      margin-bottom: 0.6rem;
    }
    .game-description {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 1rem;
    }
    .game-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-top: 1px solid var(--glass-border);
      padding-top: 0.8rem;
    }
    .game-download {
      color: var(--sakura);
      font-weight: 600;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(18,19,22,0.9);
      backdrop-filter: blur(20px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      width: min(90vw, 800px);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      margin: 0;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background var(--transition);
    }
    .modal-close:hover { background: var(--glass); }
    .modal-body { padding: 1.5rem; }
    .modal-image {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, rgba(91,157,255,0.1), rgba(91,157,255,0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      margin-bottom: 1.2rem;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .modal-description {
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .modal-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .detail-item { display: flex; flex-direction: column; }
    .detail-label {
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 0.3rem;
      font-family: var(--font-ui);
    }
    .detail-value { font-size: 0.9rem; color: var(--text); }
    .modal-download-btn {
      display: block;
      width: 100%;
      padding: 0.8rem 1.5rem;
      text-align: center;
      background: linear-gradient(135deg, var(--sakura-deep), var(--accent));
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 1rem;
    }
    .modal-download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(91,157,255,0.5);
    }
    @media (max-width: 680px) {
      .games-grid { grid-template-columns: minmax(0, 1fr); }
      .modal {
        padding: 1rem;
        align-items: flex-start;
      }
      .modal-content {
        width: 100%;
        max-height: calc(100dvh - 2rem);
        margin: 0;
      }
    }
  </style>
</head>
<body data-root-prefix="../" data-active-nav="games" data-loader-text="加载次元世界中...">

  <main class="site-wrapper" id="main-content" tabindex="-1">
    <section class="page-hero reveal">

          <div class="detail-item"><span class="detail-label">平台</span><span class="detail-value" id="modal-game-platform">游戏平台</span></div>
          <div class="detail-item"><span class="detail-label">发布时间</span><span class="detail-value" id="modal-game-date">发布日期</span></div>
          <div class="detail-item"><span class="detail-label">状态</span><span class="detail-value" id="modal-game-status">开发状态</span></div>
        </div>
        <a href="https://pan.baidu.com/s/1X_q_1Y1g5zo2IXcbc9LNjQ?pwd=sbkk" class="modal-download-btn" id="modal-download-link" target="_blank" rel="noreferrer noopener">百度网盘下载</a>
      </div>
    </div>
  </div>

  <div id="site-shell-bottom"></div>
